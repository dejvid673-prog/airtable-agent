[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airtable-product-workbook-agent"
version = "0.2.0"
description = "Local XLSX preparation and approved Airtable sync through the official Airtable MCP CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "7DEJV" }]
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
airtable-workbook-agent = "airtable_workbook_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
