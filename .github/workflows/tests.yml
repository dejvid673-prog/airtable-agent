name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - name: Package source snapshot for audit
        uses: actions/upload-artifact@v4
        with:
          name: airtable-agent-source-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .
            !.git/**
            !.venv/**
            !.secrets/**
            !data/input/**
            !data/output/**
            !runs/**
            !approvals/**
            !**/*.xlsx
            !**/*.xls
            !**/*.xlsm
            !**/*.xlsb

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Parse PowerShell scripts with Windows PowerShell
        shell: powershell
        run: |
          $allErrors = @()
          Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null
              foreach ($parseError in $parseErrors) {
                  $allErrors += "$($_.Name): $($parseError.Message)"
              }
          }
          if ($allErrors.Count -gt 0) {
              $allErrors | ForEach-Object { Write-Error $_ }
              throw "PowerShell parser validation failed."
          }
      - name: Run bootstrap installation
        shell: powershell
        run: .\scripts\bootstrap.ps1 -PythonCommand python -SkipAirtableCli -SkipTests
      - name: Test encrypted REST token helper
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force .secrets | Out-Null
          $secure = ConvertTo-SecureString "pat.test" -AsPlainText -Force
          ConvertFrom-SecureString $secure | Set-Content .secrets\airtable-token.dpapi -Encoding ASCII
          . .\scripts\_airtable_rest_token.ps1
          if ((Get-AirtableRestToken) -ne "pat.test") { throw "DPAPI token round-trip failed." }
      - name: Test vendored Airtable skills
        shell: powershell
        run: .\.venv\Scripts\python.exe -m unittest tests.test_vendor_skills -v
      - name: Test XLSX backend
        shell: powershell
        run: .\.venv\Scripts\python.exe -m unittest tests.test_xlsx_backend -v
      - name: Test product transformation
        shell: powershell
        run: .\.venv\Scripts\python.exe -m unittest tests.test_product_transform -v
      - name: Test reporting
        shell: powershell
        run: .\.venv\Scripts\python.exe -m unittest tests.test_reporting -v
      - name: Test Airtable REST layer
        shell: powershell
        run: .\.venv\Scripts\python.exe -m unittest tests.test_airtable_rest -v
      - name: Test Airtable CLI layer
        shell: powershell
        run: .\.venv\Scripts\python.exe -m unittest tests.test_airtable_cli -v
      - name: Test Airtable sync layer
        shell: powershell
        run: .\.venv\Scripts\python.exe -m unittest tests.test_airtable_sync -v
      - name: Test optional artifact integration
        shell: powershell
        run: .\.venv\Scripts\python.exe -m unittest tests.test_integration_artifact -v
